name: Aplicar relações normativas explícitas

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - master
    paths:
      - .github/apply-rule-relations.trigger

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'aplicar-relacoes-normativas'
    runs-on: ubuntu-latest

    steps:
      - name: Obter branch da atualização
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aplicar e validar relações normativas
        run: python .github/scripts/apply-rule-relations.py

      - name: Remover automação temporária
        run: |
          rm .github/scripts/apply-rule-relations.py
          rm .github/workflows/apply-rule-relations.yml
          rm .github/apply-rule-relations.trigger

      - name: Registrar alterações na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regrasDev.md regrasProjeto.md regrasUxUi.md .github/
          git commit -m "docs: explicitar relações normativas entre regras"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
